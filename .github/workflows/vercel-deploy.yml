name: CI and Vercel Deploy

on:
  pull_request:
    branches:
      - main
      - dev-deployment
  push:
    branches:
      - main
      - dev-deployment
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 59.0.0
  PRODUCTION_URL: https://gontobbo-booking-app.vercel.app

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  deployment-target:
    name: Resolve deployment target
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      target: ${{ steps.target.outputs.target }}
      vercel_environment: ${{ steps.target.outputs.vercel_environment }}
    steps:
      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.environment }}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            TARGET="production"
          else
            TARGET="preview"
          fi

          if [[ "$TARGET" == "production" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Production deployments are only allowed from main." >&2
            exit 1
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "vercel_environment=$([[ "$TARGET" == "production" ]] && echo production || echo preview)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs:
      - ci
      - deployment-target
    if: github.event_name != 'pull_request'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment="${{ needs.deployment-target.outputs.vercel_environment }}" --token="$VERCEL_TOKEN"

      - name: Validate pulled Vercel environment
        id: envcheck
        shell: bash
        env:
          DEPLOY_TARGET: ${{ needs.deployment-target.outputs.target }}
          VERCEL_ENVIRONMENT: ${{ needs.deployment-target.outputs.vercel_environment }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const path = `.vercel/.env.${process.env.VERCEL_ENVIRONMENT}.local`;

          if (!fs.existsSync(path)) {
            console.error(`Pulled Vercel environment file was not found: ${path}`);
            process.exit(1);
          }

          const env = {};
          const lines = fs.readFileSync(path, "utf8").split(/\r?\n/);
          for (const line of lines) {
            if (!line || line.trimStart().startsWith("#")) continue;
            const index = line.indexOf("=");
            if (index === -1) continue;
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1);
            if (value.endsWith("\r")) value = value.slice(0, -1);
            if (
              (value.startsWith('"') && value.endsWith('"')) ||
              (value.startsWith("'") && value.endsWith("'"))
            ) {
              value = value.slice(1, -1);
            }
            value = value.replace(/\\"/g, '"').replace(/\\'/g, "'");
            env[key] = value;
          }

          const apiUrl = env.NEXT_PUBLIC_BASE_URL;
          const authSecret = env.AUTH_SECRET;

          if (!apiUrl) {
            console.error("NEXT_PUBLIC_BASE_URL is required in the pulled Vercel environment.");
            process.exit(1);
          }

          if (!authSecret) {
            console.error("AUTH_SECRET is required in the pulled Vercel environment.");
            process.exit(1);
          }

          if (apiUrl !== apiUrl.trim()) {
            console.error("NEXT_PUBLIC_BASE_URL must not have leading or trailing whitespace.");
            process.exit(1);
          }

          if ((apiUrl.startsWith('"') && apiUrl.endsWith('"')) || (apiUrl.startsWith("'") && apiUrl.endsWith("'"))) {
            console.error("NEXT_PUBLIC_BASE_URL must not be surrounded by quotes.");
            process.exit(1);
          }

          let parsed;
          try {
            parsed = new URL(apiUrl);
          } catch {
            console.error("NEXT_PUBLIC_BASE_URL must be a valid absolute URL.");
            process.exit(1);
          }

          if (!parsed.protocol || !parsed.host) {
            console.error("NEXT_PUBLIC_BASE_URL must be a valid absolute URL.");
            process.exit(1);
          }

          if (process.env.DEPLOY_TARGET === "production" && parsed.protocol !== "https:") {
            console.error("Production NEXT_PUBLIC_BASE_URL must use HTTPS.");
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `api_url=${apiUrl}\n`);
          console.log(`Validated NEXT_PUBLIC_BASE_URL: ${apiUrl}`);
          NODE

      - name: Build project artifacts in GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.deployment-target.outputs.target }}" == "production" ]]; then
            npx --yes "vercel@$VERCEL_CLI_VERSION" build --prod --token="$VERCEL_TOKEN"
          else
            npx --yes "vercel@$VERCEL_CLI_VERSION" build --target=preview --token="$VERCEL_TOKEN"
          fi

      - name: Verify compiled API base URL
        shell: bash
        env:
          API_BASE_URL: ${{ steps.envcheck.outputs.api_url }}
        run: |
          set -euo pipefail
          test -d .vercel/output
          if ! grep -R -F -- "$API_BASE_URL" .vercel/output >/dev/null; then
            echo "Expected NEXT_PUBLIC_BASE_URL was not found in .vercel/output." >&2
            exit 1
          fi

      - name: Deploy prebuilt artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          args=(deploy --prebuilt --yes --token="$VERCEL_TOKEN")
          if [[ "${{ needs.deployment-target.outputs.target }}" == "production" ]]; then
            args+=(--prod)
          fi

          deploy_output="$(npx --yes "vercel@$VERCEL_CLI_VERSION" "${args[@]}")"
          echo "$deploy_output"
          deployment_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)"
          if [[ -z "$deployment_url" ]]; then
            echo "Unable to determine Vercel deployment URL." >&2
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $deployment_url"

      - name: Inspect deployment
        shell: bash
        run: npx --yes "vercel@$VERCEL_CLI_VERSION" inspect "${{ steps.deploy.outputs.deployment_url }}" --token="$VERCEL_TOKEN"

      - name: Verify production URL
        if: needs.deployment-target.outputs.target == 'production'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$PRODUCTION_URL" >/dev/null

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## Vercel deployment"
            echo ""
            echo "- Environment: ${{ needs.deployment-target.outputs.target }}"
            echo "- Commit SHA: ${GITHUB_SHA}"
            echo "- Deployment URL: ${{ steps.deploy.outputs.deployment_url }}"
            if [[ "${{ needs.deployment-target.outputs.target }}" == "production" ]]; then
              echo "- Production URL: $PRODUCTION_URL"
            fi
            echo "- API base URL: ${{ steps.envcheck.outputs.api_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
