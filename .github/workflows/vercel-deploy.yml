name: Vercel Deploy

on:
  push:
    branches:
      - main
      - dev-deployment
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.environment }}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            TARGET="production"
          else
            TARGET="preview"
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            client/.next/cache
            client/.vercel/cache
          key: ${{ runner.os }}-client-build-${{ steps.target.outputs.target }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-client-build-${{ steps.target.outputs.target }}-
            ${{ runner.os }}-client-build-

      - name: Pull Vercel environment
        working-directory: client
        run: npx --yes vercel@latest pull --yes --environment=${{ steps.target.outputs.target }} --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        working-directory: client
        run: |
          if [[ "${{ steps.target.outputs.target }}" == "production" ]]; then
            npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@latest build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy to Vercel
        working-directory: client
        shell: bash
        run: |
          if [[ "${{ steps.target.outputs.target }}" == "production" ]]; then
            npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@latest deploy --prebuilt --yes --token="$VERCEL_TOKEN"
          fi
